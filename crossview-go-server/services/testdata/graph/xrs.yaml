apiVersion: platform.example.org/v1alpha1
kind: IdentityProvider
metadata:
  name: identity
  namespace: identity
spec:
  crossplane:
    compositionRef:
      name: identityprovider
    resourceRefs:
        - apiVersion: platform.example.org/v1alpha1
          kind: IdentityGroup
          name: admins
          namespace: identity
        - apiVersion: platform.example.org/v1alpha1
          kind: IdentityUser
          name: user-1
          namespace: identity
        - apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          name: identity-deploy
          namespace: identity
status:
  conditions:
    - type: Ready
      status: "True"
    - type: Synced
      status: "True"
