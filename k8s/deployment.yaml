apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossview
  namespace: crossview
  labels:
    app: crossview
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: crossview
  template:
    metadata:
      labels:
        app: crossview
    spec:
      serviceAccountName: crossview-sa
      containers:
      - name: crossview
        image: ghcr.io/crossplane-contrib/crossview:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crossview-secrets
              key: db-password
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: crossview-secrets
              key: session-secret
        - name: MANAGED_CACHE_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: MANAGED_CACHE_TTL_SECONDS
        - name: MANAGED_PAGE_SIZE
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: MANAGED_PAGE_SIZE
        - name: MANAGED_MAX_ITEMS_PER_TYPE
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: MANAGED_MAX_ITEMS_PER_TYPE
        - name: MANAGED_MAX_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: crossview-config
              key: MANAGED_MAX_CONCURRENCY
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      # Pod anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - crossview
              topologyKey: kubernetes.io/hostname

